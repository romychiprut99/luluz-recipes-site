<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ספר המתכונים של לולוז</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { theme: { DEFAULT: '#c4704b', light: '#fdf6f0', dark: '#a85a3a' } } } }
        }
    </script>
    <style>
        body { font-family: 'Assistant', sans-serif; background-color: #fefcf9; direction: rtl; }
        .white-space-pre { white-space: pre-wrap; }
        .page { display: none; }
        .page.active { display: block; }
        /* Smooth loading spinner */
        .loader { border-top-color: #c4704b; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        /* Vertical range slider */
        .img-pos-slider { writing-mode: vertical-lr; direction: rtl; width: 24px; height: 100px; cursor: pointer; }
        /* Prevent iOS Safari from zooming when focusing inputs (font-size must be >=16px) */
        input, textarea, select { font-size: 16px; }
        /* Custom category dropdown items */
        #categoryDropdown li { padding: 12px 16px; cursor: pointer; transition: background-color 0.15s; }
        #categoryDropdown li:hover, #categoryDropdown li.active { background-color: #fdf6f0; }
        #categoryDropdown li.new-item { color: #c4704b; font-weight: 600; border-top: 1px solid #f3f3f3; }
    </style>
</head>
<body class="text-gray-900">

    <div id="pageMenu" class="page active">
        <header class="py-12 border-b border-gray-100 bg-theme-light/50">
            <div class="max-w-6xl mx-auto px-6 flex justify-between items-center">
                <h1 class="text-4xl font-bold text-theme cursor-pointer" onclick="navigateTo('pageMenu')">המתכונים של לולוז</h1>
                <button onclick="openCreateForm()" class="bg-theme text-white w-14 h-14 rounded-full shadow-lg hover:bg-theme-dark transition flex items-center justify-center text-4xl font-light">+</button>
            </div>
        </header>
        <main class="max-w-6xl mx-auto px-6 py-12">
            <div class="relative mb-6">
                <input type="text" id="searchInput" placeholder="חיפוש מתכון..." oninput="onSearchChange(this.value)" class="w-full p-4 pr-12 bg-white border border-theme/30 rounded-2xl outline-none focus:ring-2 focus:ring-theme transition-all shadow-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 absolute right-4 top-1/2 -translate-y-1/2 text-theme/60" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
                </svg>
            </div>
            <div id="categoryTabs" class="flex flex-wrap gap-2 mb-8 border-b border-theme/20 pb-1"></div>
            <div id="menuGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
        </main>
    </div>

    <div id="pageCreate" class="page bg-theme-light/20 min-h-screen">
        <div class="max-w-4xl mx-auto px-6 py-12">
            <button onclick="cancelForm()" class="mb-6 text-gray-500 flex items-center gap-2 hover:text-theme transition"><span>→</span> ביטול וחזרה</button>
            <div class="bg-white p-8 rounded-[2rem] shadow-sm border border-theme-light">
                <h2 id="formTitle" class="text-3xl font-bold text-theme mb-8 text-center">הוספת מתכון חדש</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-4">
                        <input type="text" id="title" placeholder="שם המנה" class="w-full p-4 bg-gray-50 border border-gray-200 rounded-2xl outline-none focus:ring-2 focus:ring-theme transition-all">
                        <div class="relative">
                            <input type="text" id="category" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="קטגוריה (בחרי מהרשימה או הקלידי חדשה)" class="w-full p-4 pl-12 bg-gray-50 border border-gray-200 rounded-2xl outline-none focus:ring-2 focus:ring-theme transition-all" oninput="filterCategoryOptions()" onfocus="openCategoryDropdown()">
                            <button type="button" tabindex="-1" onclick="toggleCategoryDropdown(event)" class="absolute left-2 top-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center text-theme/70 hover:text-theme">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
                            </button>
                            <ul id="categoryDropdown" class="hidden absolute z-20 mt-1 w-full max-h-60 overflow-y-auto bg-white border border-gray-200 rounded-2xl shadow-lg"></ul>
                        </div>
                        <div class="p-4 border-2 border-dashed border-theme-light rounded-2xl bg-gray-50 text-center">
                            <label class="cursor-pointer block">
                                <span id="fileName" class="text-gray-500 text-sm">לחץ לבחירת תמונה מהגלריה</span>
                                <input type="file" id="imageFile" accept="image/*" class="hidden" onchange="updateFileName(this)">
                            </label>
                        </div>
                        <div id="currentImagePreview" class="hidden">
                            <p class="text-sm text-gray-500 mb-2">תמונה נוכחית:</p>
                            <img id="currentImage" class="w-full h-32 object-cover rounded-xl">
                        </div>
                    </div>
                    <div class="space-y-4">
                        <textarea id="ingredients" placeholder="מצרכים..." class="w-full p-4 bg-gray-50 border border-gray-200 rounded-2xl outline-none focus:ring-2 focus:ring-theme h-32"></textarea>
                        <textarea id="steps" placeholder="שלבי הכנה..." class="w-full p-4 bg-gray-50 border border-gray-200 rounded-2xl outline-none focus:ring-2 focus:ring-theme h-32"></textarea>
                    </div>
                </div>
                <button id="saveBtn" onclick="processAndSave()" class="w-full mt-8 bg-theme text-white font-bold py-5 rounded-2xl hover:bg-theme-dark transition-all text-xl shadow-lg shadow-theme/20">שמור מתכון ופרסם</button>
            </div>
        </div>
    </div>

    <div id="pageView" class="page min-h-screen">
        <div class="max-w-4xl mx-auto px-6 py-12">
            <button onclick="navigateTo('pageMenu')" class="mb-8 text-theme font-bold flex items-center gap-2"><span>→</span> חזרה לתפריט</button>
            <div id="viewContent"></div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const SUPABASE_URL = 'https://ydyzgkjawrbyitahmwtu.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_VC_Xm-WhVxpyUg7RTKAAnQ_A_ZWHpQu';

        // Correct initialization
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- STATE ---
        let editingRecipeId = null; // Tracks whether we're editing an existing recipe
        let editingRecipeImg = null; // Stores the current image when editing
        let recipesCache = null; // Local cache of all recipes
        let activeCategory = 'all'; // Currently selected category filter
        let searchQuery = ''; // Currently typed search query

        // --- SLUG UTILITIES ---
        function toSlug(title) {
            return title.trim().replace(/\s+/g, '-');
        }

        function fromSlug(slug) {
            return decodeURIComponent(slug).replace(/-/g, ' ');
        }

        function formatText(text) {
            if (!text) return '';
            return text.split('\n').map(line => {
                if (line.trimStart().startsWith('*')) {
                    const content = line.replace(/^\s*\*\s?/, '');
                    return `<label class="flex items-start gap-3 cursor-pointer group py-1">
                        <input type="checkbox" class="mt-1.5 w-5 h-5 rounded border-gray-300 text-theme focus:ring-theme cursor-pointer accent-[#c4704b]" onchange="this.parentElement.classList.toggle('line-through'); this.parentElement.classList.toggle('text-gray-400')">
                        <span class="transition-all">${content}</span>
                    </label>`;
                }
                if (line.trim() === '') return '<br>';
                return `<div>${line}</div>`;
            }).join('');
        }

        function updateFileName(input) {
            const name = input.files[0]?.name || "לחץ לבחירת תמונה מהגלריה";
            document.getElementById('fileName').innerText = name;
        }

        async function fetchAllRecipes(forceRefresh = false) {
            if (recipesCache && !forceRefresh) return recipesCache;
            const { data: recipes } = await _supabase.from('recipes').select('*').order('created_at', { ascending: false });
            recipesCache = recipes || [];
            return recipesCache;
        }

        function selectCategory(cat) {
            activeCategory = cat;
            renderMenu();
        }

        function onSearchChange(value) {
            searchQuery = value.trim().toLowerCase();
            renderMenu();
        }

        async function renderMenu() {
            const grid = document.getElementById('menuGrid');
            const tabsEl = document.getElementById('categoryTabs');
            const recipes = await fetchAllRecipes();

            if (recipes.length === 0) {
                tabsEl.innerHTML = '';
                grid.innerHTML = `<p class="col-span-full text-center py-20 text-gray-400 italic">אין מתכונים עדיין. לחץ על ה- + למעלה!</p>`;
                return;
            }

            // Build unique category list
            const categories = [...new Set(recipes.map(r => r.cat || 'כללי'))].sort();
            // Make sure activeCategory still exists, otherwise reset
            if (activeCategory !== 'all' && !categories.includes(activeCategory)) {
                activeCategory = 'all';
            }

            // Render tabs
            const tabBtn = (label, value, count) => {
                const isActive = activeCategory === value;
                return `<button onclick="selectCategory('${value.replace(/'/g, "\\'")}')" class="px-5 py-2.5 rounded-t-xl font-bold text-sm transition-all ${isActive ? 'bg-theme text-white shadow-md' : 'text-theme-dark hover:bg-theme-light'}">${label} <span class="text-xs opacity-70">(${count})</span></button>`;
            };
            tabsEl.innerHTML = [
                tabBtn('הכל', 'all', recipes.length),
                ...categories.map(cat => tabBtn(cat, cat, recipes.filter(r => (r.cat || 'כללי') === cat).length))
            ].join('');

            // Filter recipes by active category and search query
            let filtered = activeCategory === 'all'
                ? recipes
                : recipes.filter(r => (r.cat || 'כללי') === activeCategory);

            if (searchQuery) {
                filtered = filtered.filter(r => (r.title || '').toLowerCase().includes(searchQuery));
            }

            if (filtered.length === 0) {
                const msg = searchQuery ? `לא נמצאו מתכונים עבור "${searchQuery}"` : 'אין מתכונים בקטגוריה זו';
                grid.innerHTML = `<p class="col-span-full text-center py-20 text-gray-400 italic">${msg}</p>`;
                return;
            }

            grid.innerHTML = filtered.map(r => `
                <div class="bg-white rounded-3xl overflow-hidden shadow-sm border border-gray-100 hover:shadow-md transition cursor-pointer relative group" onclick="viewRecipe(${r.id})">
                    <img src="${r.img}" class="h-64 w-full object-cover" style="object-position: center ${r.img_pos || 50}%">
                    <div class="p-6">
                        <span class="text-theme text-xs font-bold uppercase tracking-widest">${r.cat}</span>
                        <h3 class="text-2xl mt-1 font-bold text-gray-800">${r.title}</h3>
                    </div>
                    <button onclick="event.stopPropagation(); deleteRecipe(${r.id})" class="absolute top-3 left-3 bg-white/80 backdrop-blur-sm text-red-400 hover:bg-red-500 hover:text-white w-10 h-10 rounded-full shadow-md transition-all flex items-center justify-center opacity-0 group-hover:opacity-100" title="מחיקה">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                        </svg>
                    </button>
                </div>
            `).join('');
        }

        // --- CREATE / EDIT FORM ---
        let availableCategories = [];

        async function populateCategoryOptions() {
            const recipes = await fetchAllRecipes();
            availableCategories = [...new Set(recipes.map(r => r.cat || 'כללי').filter(Boolean))].sort();
            renderCategoryDropdown('');
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
        }

        function renderCategoryDropdown(query) {
            const dropdown = document.getElementById('categoryDropdown');
            const q = (query || '').trim().toLowerCase();
            const matches = availableCategories.filter(c => c.toLowerCase().includes(q));
            const exactMatch = availableCategories.some(c => c.toLowerCase() === q);

            const handler = (val) => `onmousedown="selectCategoryOption(event, '${val}')" ontouchstart="selectCategoryOption(event, '${val}')"`;

            let html = matches.map(c => {
                const safe = escapeHtml(c).replace(/'/g, "\\'");
                return `<li ${handler(safe)}>${escapeHtml(c)}</li>`;
            }).join('');

            // If the user typed something that doesn't exactly match an existing category, offer to use it as new
            if (q && !exactMatch) {
                const safe = escapeHtml(query.trim()).replace(/'/g, "\\'");
                html += `<li class="new-item" ${handler(safe)}>+ הוסיפי קטגוריה חדשה: "${escapeHtml(query.trim())}"</li>`;
            }

            if (!html) {
                html = `<li class="text-gray-400 italic" style="cursor:default">אין קטגוריות עדיין — הקלידי שם חדש</li>`;
            }

            dropdown.innerHTML = html;
        }

        function openCategoryDropdown() {
            const dropdown = document.getElementById('categoryDropdown');
            renderCategoryDropdown(document.getElementById('category').value);
            dropdown.classList.remove('hidden');
        }

        function closeCategoryDropdown() {
            document.getElementById('categoryDropdown').classList.add('hidden');
        }

        function toggleCategoryDropdown(e) {
            e.preventDefault();
            e.stopPropagation();
            const dropdown = document.getElementById('categoryDropdown');
            const input = document.getElementById('category');
            if (dropdown.classList.contains('hidden')) {
                input.focus();
                openCategoryDropdown();
            } else {
                closeCategoryDropdown();
            }
        }

        function filterCategoryOptions() {
            renderCategoryDropdown(document.getElementById('category').value);
            document.getElementById('categoryDropdown').classList.remove('hidden');
        }

        function selectCategoryOption(e, value) {
            // Use mousedown/touchstart so the click registers before the input loses focus on iOS
            if (e) { e.preventDefault(); e.stopPropagation(); }
            document.getElementById('category').value = value;
            closeCategoryDropdown();
        }

        // Close dropdown when tapping outside (works for both mouse and touch / iOS)
        document.addEventListener('mousedown', (e) => {
            const input = document.getElementById('category');
            const dropdown = document.getElementById('categoryDropdown');
            if (!input || !dropdown) return;
            if (!input.contains(e.target) && !dropdown.contains(e.target) && !e.target.closest('button[onclick*="toggleCategoryDropdown"]')) {
                closeCategoryDropdown();
            }
        });
        document.addEventListener('touchstart', (e) => {
            const input = document.getElementById('category');
            const dropdown = document.getElementById('categoryDropdown');
            if (!input || !dropdown) return;
            if (!input.contains(e.target) && !dropdown.contains(e.target) && !e.target.closest('button[onclick*="toggleCategoryDropdown"]')) {
                closeCategoryDropdown();
            }
        }, { passive: true });

        async function openCreateForm() {
            editingRecipeId = null;
            editingRecipeImg = null;
            document.getElementById('formTitle').innerText = 'הוספת מתכון חדש';
            document.getElementById('title').value = '';
            document.getElementById('category').value = '';
            document.getElementById('ingredients').value = '';
            document.getElementById('steps').value = '';
            document.getElementById('imageFile').value = '';
            document.getElementById('fileName').innerText = 'לחץ לבחירת תמונה מהגלריה';
            document.getElementById('currentImagePreview').classList.add('hidden');
            document.getElementById('saveBtn').innerText = 'שמור מתכון ופרסם';
            document.getElementById('saveBtn').disabled = false;
            await populateCategoryOptions();
            navigateTo('pageCreate');
        }

        async function openEditForm(recipe) {
            editingRecipeId = recipe.id;
            editingRecipeImg = recipe.img;
            document.getElementById('formTitle').innerText = 'עריכת מתכון';
            document.getElementById('title').value = recipe.title;
            document.getElementById('category').value = recipe.cat || '';
            document.getElementById('ingredients').value = recipe.ingredients || '';
            document.getElementById('steps').value = recipe.steps || '';
            document.getElementById('imageFile').value = '';
            document.getElementById('fileName').innerText = 'לחץ לבחירת תמונה חדשה (אופציונלי)';
            // Show current image preview
            document.getElementById('currentImage').src = recipe.img;
            document.getElementById('currentImagePreview').classList.remove('hidden');
            document.getElementById('saveBtn').innerText = 'שמור שינויים';
            document.getElementById('saveBtn').disabled = false;
            await populateCategoryOptions();
            navigateTo('pageCreate');
        }

        function cancelForm() {
            editingRecipeId = null;
            editingRecipeImg = null;
            navigateTo('pageMenu');
        }

        async function processAndSave() {
            const title = document.getElementById('title').value;
            if(!title) return alert("בבקשה תני שם למתכון!");

            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.innerHTML = '<div class="loader ease-linear rounded-full border-2 border-t-2 border-gray-200 h-6 w-6 mx-auto"></div>';

            const file = document.getElementById('imageFile').files[0];

            if (file) {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = async () => {
                    await saveToSupabase(reader.result);
                };
            } else if (editingRecipeId && editingRecipeImg) {
                // Editing and no new image selected — keep existing image
                await saveToSupabase(editingRecipeImg);
            } else {
                // New recipe with no image — use default
                await saveToSupabase('https://images.unsplash.com/photo-1495521821757-a1efb6729352?w=800');
            }
        }

        async function saveToSupabase(img) {
            const recipeData = {
                title: document.getElementById('title').value,
                cat: document.getElementById('category').value || 'כללי',
                ingredients: document.getElementById('ingredients').value,
                steps: document.getElementById('steps').value,
                img: img
            };

            let error;
            let savedId = editingRecipeId;

            if (editingRecipeId) {
                // UPDATE existing recipe
                const result = await _supabase.from('recipes').update(recipeData).eq('id', editingRecipeId).select();
                error = result.error;
                if (!error && (!result.data || result.data.length === 0)) {
                    error = { message: 'העדכון נכשל. ייתכן שחסרות הרשאות UPDATE בטבלה. יש להוסיף RLS policy עבור UPDATE בלוח הבקרה של Supabase.' };
                }
                if (result.data && result.data.length > 0) {
                    savedId = result.data[0].id;
                }
            } else {
                // INSERT new recipe
                const result = await _supabase.from('recipes').insert([recipeData]).select();
                error = result.error;
                if (result.data && result.data.length > 0) {
                    savedId = result.data[0].id;
                }
            }

            if (error) {
                alert("שגיאה בשמירה: " + error.message);
                document.getElementById('saveBtn').disabled = false;
                document.getElementById('saveBtn').innerText = "נסה שוב";
            } else {
                // Invalidate cache and clear state
                recipesCache = null;
                editingRecipeId = null;
                editingRecipeImg = null;
                document.getElementById('title').value = '';
                document.getElementById('category').value = '';
                document.getElementById('ingredients').value = '';
                document.getElementById('steps').value = '';
                document.getElementById('imageFile').value = '';
                document.getElementById('currentImagePreview').classList.add('hidden');

                // Navigate to the saved recipe by its ID
                if (savedId) {
                    await viewRecipe(savedId);
                } else {
                    navigateTo('pageMenu');
                }
            }
        }

        async function viewRecipe(id) {
            const recipes = await fetchAllRecipes();
            let r = recipes.find(rec => rec.id === id);
            if (!r) {
                // Not in cache, try fetching directly
                const { data } = await _supabase.from('recipes').select('*').eq('id', id).single();
                r = data;
            }
            if (!r) return navigateTo('pageMenu');

            // Update URL hash to recipe slug
            history.replaceState(null, '', '#' + toSlug(r.title));
            document.title = r.title + ' | המתכונים של לולוז';

            document.getElementById('viewContent').innerHTML = `
                <div class="flex items-center justify-between mb-10">
                    <div></div>
                    <div class="flex items-center gap-3">
                        <button onclick="shareRecipe()" class="bg-blue-50 text-blue-500 hover:bg-blue-500 hover:text-white px-6 py-3 rounded-2xl font-bold transition-all flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path d="M15 8a3 3 0 10-2.977-2.63l-4.94 2.47a3 3 0 100 4.319l4.94 2.47a3 3 0 10.895-1.789l-4.94-2.47a3.027 3.027 0 000-.74l4.94-2.47C13.456 7.68 14.19 8 15 8z" />
                            </svg>
                            שיתוף
                        </button>
                        <button onclick="editRecipe(${r.id})" class="bg-theme/10 text-theme hover:bg-theme hover:text-white px-6 py-3 rounded-2xl font-bold transition-all flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" />
                            </svg>
                            עריכה
                        </button>
                        <button onclick="deleteRecipe(${r.id})" class="bg-red-50 text-red-500 hover:bg-red-500 hover:text-white px-6 py-3 rounded-2xl font-bold transition-all flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                            </svg>
                            מחיקה
                        </button>
                    </div>
                </div>
                <div class="relative group/img mb-10">
                    <img id="recipeImg" src="${r.img}" class="w-full h-48 md:h-72 object-cover rounded-[2rem] md:rounded-[3rem] shadow-xl" style="object-position: center ${r.img_pos || 50}%">
                    <div class="absolute left-3 top-1/2 -translate-y-1/2 opacity-0 group-hover/img:opacity-100 transition-opacity flex flex-col items-center gap-1 bg-white/80 backdrop-blur-sm rounded-2xl p-2 shadow-lg">
                        <span class="text-xs text-gray-500 mb-1">📷</span>
                        <input type="range" min="0" max="100" value="${r.img_pos || 50}" orient="vertical" class="img-pos-slider accent-[#c4704b]" oninput="document.getElementById('recipeImg').style.objectPosition = 'center ' + this.value + '%'" onchange="saveImagePosition(${r.id}, this.value)">
                    </div>
                </div>
                <h1 class="text-4xl font-bold mb-10 border-r-8 border-theme pr-6 text-gray-900">${r.title}</h1>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
                    <div class="bg-theme-light p-10 rounded-[2.5rem] border border-theme/20">
                        <h3 class="text-2xl font-bold mb-4 text-theme-dark">🛒 מצרכים</h3>
                        <div class="text-xl leading-relaxed space-y-1">${formatText(r.ingredients)}</div>
                    </div>
                    <div>
                        <h3 class="text-2xl font-bold mb-4 text-gray-700">👨‍🍳 שלבי הכנה</h3>
                        <div class="text-xl leading-relaxed space-y-1">${formatText(r.steps)}</div>
                    </div>
                </div>
            `;
            navigateTo('pageView');
        }

        async function saveImagePosition(id, pos) {
            const { error } = await _supabase.from('recipes').update({ img_pos: parseInt(pos) }).eq('id', id).select();
            if (error) {
                console.error('Error saving image position:', error.message);
            } else {
                // Update cache
                if (recipesCache) {
                    const r = recipesCache.find(rec => rec.id === id);
                    if (r) r.img_pos = parseInt(pos);
                }
            }
        }

        async function editRecipe(id) {
            const recipes = await fetchAllRecipes();
            const r = recipes.find(rec => rec.id === id);
            if (!r) return alert('מתכון לא נמצא');
            openEditForm(r);
        }

        async function deleteRecipe(id) {
            if (!confirm('למחוק את המתכון?')) return;
            const { error } = await _supabase.from('recipes').delete().eq('id', id);
            if (error) {
                alert('שגיאה במחיקה: ' + error.message);
            } else {
                recipesCache = null; // Invalidate cache
                navigateTo('pageMenu');
            }
        }

        async function shareRecipe() {
            const url = decodeURIComponent(window.location.href);
            try {
                await navigator.clipboard.writeText(url);
                // Show a brief "copied" tooltip
                const btn = event.currentTarget;
                const originalText = btn.innerHTML;
                btn.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
                    </svg>
                    הקישור הועתק!
                `;
                btn.classList.remove('bg-blue-50', 'text-blue-500');
                btn.classList.add('bg-green-100', 'text-green-600');
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.classList.remove('bg-green-100', 'text-green-600');
                    btn.classList.add('bg-blue-50', 'text-blue-500');
                }, 2000);
            } catch (err) {
                // Fallback for older browsers
                prompt('העתק את הקישור:', url);
            }
        }

        async function viewRecipeBySlug(slug) {
            const title = fromSlug(slug);
            const recipes = await fetchAllRecipes();
            const r = recipes.find(rec => rec.title.trim().toLowerCase() === title.trim().toLowerCase());
            if (r) {
                await viewRecipe(r.id);
            } else {
                navigateTo('pageMenu');
            }
        }

        function navigateTo(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            window.scrollTo(0,0);

            if (pageId === 'pageMenu') {
                history.replaceState(null, '', window.location.pathname);
                document.title = 'ספר המתכונים של לולוז';
                renderMenu(); // Uses cache if available
            }
        }

        // --- HASH-BASED ROUTING ---
        function handleRoute() {
            const hash = window.location.hash.slice(1); // Remove the '#'
            if (hash) {
                viewRecipeBySlug(hash);
            } else {
                navigateTo('pageMenu');
            }
        }

        window.addEventListener('hashchange', handleRoute);

        // Initialize — no delay needed, Supabase client is ready synchronously
        handleRoute();
    </script>
</body>
</html>
