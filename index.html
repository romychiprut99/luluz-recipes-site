<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ספר המתכונים של לולוז</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { theme: { DEFAULT: '#c4704b', light: '#fdf6f0', dark: '#a85a3a' } } } }
        }
    </script>
    <style>
        body { font-family: 'Assistant', sans-serif; background-color: #fefcf9; direction: rtl; }
        .white-space-pre { white-space: pre-wrap; }
        .page { display: none; }
        .page.active { display: block; }
        /* Prevent iOS Safari from zooming when focusing inputs (font-size must be >=16px) */
        input, textarea, select { font-size: 16px; }
        /* Skeleton shimmer for loading cards */
        .skeleton { background: linear-gradient(90deg, #f3f0eb 0%, #faf6f0 50%, #f3f0eb 100%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .card-img { background-color: #f3f0eb; }
        /* Cards hidden by category/search filters */
        .recipe-card.hidden-card { display: none; }
    </style>
</head>
<body class="text-gray-900">

    <div id="pageMenu" class="page active">
        <header class="py-12 border-b border-gray-100 bg-theme-light/50">
            <div class="max-w-6xl mx-auto px-6 flex justify-between items-center">
                <h1 class="text-4xl font-bold text-theme cursor-pointer" onclick="navigateTo('pageMenu')">המתכונים של לולוז</h1>
            </div>
        </header>
        <main class="max-w-6xl mx-auto px-6 py-12">
            <div class="relative mb-6">
                <input type="text" id="searchInput" placeholder="חיפוש מתכון..." oninput="onSearchChange(this.value)" class="w-full p-4 pr-12 bg-white border border-theme/30 rounded-2xl outline-none focus:ring-2 focus:ring-theme transition-all shadow-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 absolute right-4 top-1/2 -translate-y-1/2 text-theme/60" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
                </svg>
            </div>
            <div id="categoryTabs" class="flex flex-wrap gap-2 mb-8 border-b border-theme/20 pb-1"></div>
            <div id="menuGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
        </main>
    </div>

    <div id="pageView" class="page min-h-screen">
        <div class="max-w-4xl mx-auto px-6 py-12">
            <button onclick="navigateTo('pageMenu')" class="mb-8 text-theme font-bold flex items-center gap-2"><span>→</span> חזרה לתפריט</button>
            <div id="viewContent"></div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        // Recipes are read from static YAML files in the ./recipes/ folder,
        // which must live next to this index.html file. recipes/index.json
        // lists the YAML filenames (one recipe per file).
        //
        // Paths are resolved against the document's own directory so the app
        // works no matter what subpath it is deployed under (e.g. GitHub Pages
        // project sites) and regardless of the URL hash.
        const RECIPES_BASE = new URL('recipes/', document.baseURI);
        const RECIPES_MANIFEST = new URL('index.json', RECIPES_BASE).href;
        function recipeUrl(filename) {
            return new URL(filename, RECIPES_BASE).href;
        }

        // --- STATE ---
        let recipesCache = null;    // Array of loaded recipe objects
        let recipesById = {};       // id -> recipe object
        let activeCategory = 'all'; // Currently selected category filter
        let searchQuery = '';       // Currently typed search query

        // --- SLUG UTILITIES ---
        function toSlug(title) {
            return title.trim().replace(/\s+/g, '-');
        }

        function fromSlug(slug) {
            return decodeURIComponent(slug).replace(/-/g, ' ');
        }

        function formatText(text) {
            if (!text) return '';
            return text.split('\n').map(line => {
                if (line.trimStart().startsWith('*')) {
                    const content = line.replace(/^\s*\*\s?/, '');
                    return `<label class="flex items-start gap-3 cursor-pointer group py-1">
                        <input type="checkbox" class="mt-1.5 w-5 h-5 rounded border-gray-300 text-theme focus:ring-theme cursor-pointer accent-[#c4704b]" onchange="this.parentElement.classList.toggle('line-through'); this.parentElement.classList.toggle('text-gray-400')">
                        <span class="transition-all">${content}</span>
                    </label>`;
                }
                if (line.trim() === '') return '<br>';
                return `<div>${line}</div>`;
            }).join('');
        }

        // --- LOADING RECIPES FROM YAML FILES ---
        // Reads the manifest, then fetches & parses every YAML file it lists.
        // Each recipe gets a stable id derived from its filename (slug).
        let recipesLoadError = null; // Populated when the manifest can't be loaded

        async function loadRecipes({ forceRefresh = false } = {}) {
            if (recipesCache && !forceRefresh) return recipesCache;

            recipesLoadError = null;

            let files;
            try {
                const res = await fetch(RECIPES_MANIFEST, { cache: 'no-cache' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                files = await res.json();
            } catch (e) {
                console.error('Failed to load recipes manifest from ' + RECIPES_MANIFEST + ':', e);
                recipesLoadError = 'לא ניתן לטעון את רשימת המתכונים (' + RECIPES_MANIFEST + ').';
                recipesCache = [];
                return recipesCache;
            }

            if (!Array.isArray(files)) {
                console.error('recipes/index.json must be an array of filenames');
                recipesLoadError = 'קובץ recipes/index.json חייב להיות מערך של שמות קבצים.';
                recipesCache = [];
                return recipesCache;
            }

            const results = await Promise.all(files.map(loadSingleRecipe));
            const recipes = results.filter(Boolean);

            // Sort alphabetically by title (Hebrew-aware) for a stable order.
            recipes.sort((a, b) => (a.title || '').localeCompare(b.title || '', 'he'));

            recipesCache = recipes;
            recipesById = {};
            recipes.forEach(r => { recipesById[r.id] = r; });
            return recipesCache;
        }

        async function loadSingleRecipe(filename) {
            try {
                const res = await fetch(recipeUrl(filename), { cache: 'no-cache' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const text = await res.text();
                const data = jsyaml.load(text) || {};
                const id = filename.replace(/\.ya?ml$/i, '');
                return {
                    id,
                    title: data.title || id,
                    cat: data.cat || 'כללי',
                    ingredients: data.ingredients || '',
                    steps: data.steps || '',
                    img: data.img || 'https://images.unsplash.com/photo-1495521821757-a1efb6729352?w=800',
                    img_pos: (data.img_pos != null) ? data.img_pos : 50,
                };
            } catch (e) {
                console.error('Failed to load recipe "' + filename + '":', e);
                return null;
            }
        }

        function selectCategory(cat) {
            activeCategory = cat;
            // Update tab highlighting without rebuilding the grid
            if (recipesCache) renderCategoryTabs(recipesCache);
            applyCardFilters();
        }

        function onSearchChange(value) {
            searchQuery = value.trim().toLowerCase();
            // Cards already in DOM — just toggle visibility
            applyCardFilters();
        }

        function renderSkeletonGrid(count = 6) {
            const grid = document.getElementById('menuGrid');
            grid.innerHTML = Array.from({ length: count }).map(() => `
                <div class="bg-white rounded-3xl overflow-hidden shadow-sm border border-gray-100">
                    <div class="h-64 w-full skeleton"></div>
                    <div class="p-6 space-y-3">
                        <div class="h-3 w-20 skeleton rounded"></div>
                        <div class="h-6 w-3/4 skeleton rounded"></div>
                    </div>
                </div>
            `).join('');
        }

        // Tracks the recipe ids we've already rendered into the DOM. If the list
        // hasn't changed (i.e. the user is just switching categories or typing
        // in search), we keep existing card nodes and only toggle visibility —
        // which means the <img> tags stay alive and the browser keeps the
        // decoded bitmaps. No flicker, no re-decode, instant filtering.
        let _renderedRecipeIds = null;

        function cardHTML(r) {
            const idAttr = escapeHtml(r.id).replace(/'/g, "\\'");
            return `
                <div class="recipe-card bg-white rounded-3xl overflow-hidden shadow-sm border border-gray-100 hover:shadow-md transition cursor-pointer relative group" data-cat="${escapeHtml(r.cat || 'כללי')}" data-title="${escapeHtml((r.title || '').toLowerCase())}" onclick="viewRecipe('${idAttr}')">
                    <img src="${escapeHtml(r.img)}" class="card-img h-64 w-full object-cover" loading="lazy" decoding="async" style="object-position: center ${r.img_pos || 50}%">
                    <div class="p-6">
                        <span class="text-theme text-xs font-bold uppercase tracking-widest">${escapeHtml(r.cat || '')}</span>
                        <h3 class="text-2xl mt-1 font-bold text-gray-800">${escapeHtml(r.title || '')}</h3>
                    </div>
                </div>
            `;
        }

        function applyCardFilters() {
            const grid = document.getElementById('menuGrid');
            const cards = grid.querySelectorAll('.recipe-card');
            let visibleCount = 0;
            cards.forEach(card => {
                const cat = card.getAttribute('data-cat') || 'כללי';
                const title = card.getAttribute('data-title') || '';
                const catOk = activeCategory === 'all' || cat === activeCategory;
                const searchOk = !searchQuery || title.includes(searchQuery);
                const show = catOk && searchOk;
                card.classList.toggle('hidden-card', !show);
                if (show) visibleCount++;
            });

            // Empty state message
            const existingMsg = grid.querySelector('.empty-msg');
            if (visibleCount === 0) {
                const msg = searchQuery ? `לא נמצאו מתכונים עבור "${searchQuery}"` : 'אין מתכונים בקטגוריה זו';
                if (existingMsg) existingMsg.textContent = msg;
                else {
                    const p = document.createElement('p');
                    p.className = 'empty-msg col-span-full text-center py-20 text-gray-400 italic';
                    p.textContent = msg;
                    grid.appendChild(p);
                }
            } else if (existingMsg) {
                existingMsg.remove();
            }
        }

        function renderCategoryTabs(recipes) {
            const tabsEl = document.getElementById('categoryTabs');
            const categories = [...new Set(recipes.map(r => r.cat || 'כללי'))].sort();
            if (activeCategory !== 'all' && !categories.includes(activeCategory)) {
                activeCategory = 'all';
            }
            const tabBtn = (label, value, count) => {
                const isActive = activeCategory === value;
                return `<button onclick="selectCategory('${value.replace(/'/g, "\\'")}')" class="px-5 py-2.5 rounded-t-xl font-bold text-sm transition-all ${isActive ? 'bg-theme text-white shadow-md' : 'text-theme-dark hover:bg-theme-light'}">${label} <span class="text-xs opacity-70">(${count})</span></button>`;
            };
            tabsEl.innerHTML = [
                tabBtn('הכל', 'all', recipes.length),
                ...categories.map(cat => tabBtn(cat, cat, recipes.filter(r => (r.cat || 'כללי') === cat).length))
            ].join('');
        }

        async function renderMenu() {
            const grid = document.getElementById('menuGrid');
            const tabsEl = document.getElementById('categoryTabs');

            // If we have nothing loaded yet, show skeleton cards while the YAML
            // files are being fetched so the page never looks blank.
            if (!recipesCache) {
                renderSkeletonGrid(6);
            }

            const recipes = await loadRecipes();

            if (recipes.length === 0) {
                tabsEl.innerHTML = '';
                _renderedRecipeIds = null;
                const msg = recipesLoadError
                    ? recipesLoadError + ' ודאי שתיקיית recipes/ נמצאת לצד index.html והאתר מוגש דרך HTTP.'
                    : 'לא נמצאו מתכונים בתיקייה.';
                grid.innerHTML = `<p class="col-span-full text-center py-20 text-gray-400 italic">${escapeHtml(msg)}</p>`;
                return;
            }

            // Render tabs (cheap — small text-only DOM)
            renderCategoryTabs(recipes);

            // Rebuild card DOM only when the recipe set itself has changed.
            const currentIds = recipes.map(r => r.id).join(',');
            if (_renderedRecipeIds !== currentIds) {
                grid.innerHTML = recipes.map(cardHTML).join('');
                _renderedRecipeIds = currentIds;
            }

            // Just toggle visibility — no DOM rebuild.
            applyCardFilters();
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
        }

        // --- VIEW SINGLE RECIPE ---
        async function viewRecipe(id) {
            await loadRecipes();
            const r = recipesById[id];
            if (!r) return navigateTo('pageMenu');

            // Update URL hash to recipe slug
            history.replaceState(null, '', '#' + toSlug(r.title));
            document.title = r.title + ' | המתכונים של לולוז';

            document.getElementById('viewContent').innerHTML = `
                <div class="flex items-center justify-between mb-10">
                    <div></div>
                    <div class="flex items-center gap-3">
                        <button onclick="shareRecipe()" class="bg-blue-50 text-blue-500 hover:bg-blue-500 hover:text-white px-6 py-3 rounded-2xl font-bold transition-all flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path d="M15 8a3 3 0 10-2.977-2.63l-4.94 2.47a3 3 0 100 4.319l4.94 2.47a3 3 0 10.895-1.789l-4.94-2.47a3.027 3.027 0 000-.74l4.94-2.47C13.456 7.68 14.19 8 15 8z" />
                            </svg>
                            שיתוף
                        </button>
                    </div>
                </div>
                <div class="mb-10">
                    <img id="recipeImg" src="${escapeHtml(r.img)}" class="w-full h-48 md:h-72 object-cover rounded-[2rem] md:rounded-[3rem] shadow-xl" style="object-position: center ${r.img_pos || 50}%">
                </div>
                <h1 class="text-4xl font-bold mb-10 border-r-8 border-theme pr-6 text-gray-900">${escapeHtml(r.title)}</h1>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
                    <div class="bg-theme-light p-10 rounded-[2.5rem] border border-theme/20">
                        <h3 class="text-2xl font-bold mb-4 text-theme-dark">🛒 מצרכים</h3>
                        <div class="text-xl leading-relaxed space-y-1">${formatText(r.ingredients)}</div>
                    </div>
                    <div>
                        <h3 class="text-2xl font-bold mb-4 text-gray-700">👨‍🍳 שלבי הכנה</h3>
                        <div class="text-xl leading-relaxed space-y-1">${formatText(r.steps)}</div>
                    </div>
                </div>
            `;
            navigateTo('pageView');
        }

        async function shareRecipe() {
            const url = decodeURIComponent(window.location.href);
            try {
                await navigator.clipboard.writeText(url);
                // Show a brief "copied" tooltip
                const btn = event.currentTarget;
                const originalText = btn.innerHTML;
                btn.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
                    </svg>
                    הקישור הועתק!
                `;
                btn.classList.remove('bg-blue-50', 'text-blue-500');
                btn.classList.add('bg-green-100', 'text-green-600');
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.classList.remove('bg-green-100', 'text-green-600');
                    btn.classList.add('bg-blue-50', 'text-blue-500');
                }, 2000);
            } catch (err) {
                // Fallback for older browsers
                prompt('העתק את הקישור:', url);
            }
        }

        async function viewRecipeBySlug(slug) {
            const title = fromSlug(slug);
            const recipes = await loadRecipes();
            const r = recipes.find(rec => (rec.title || '').trim().toLowerCase() === title.trim().toLowerCase());
            if (r) {
                await viewRecipe(r.id);
            } else {
                navigateTo('pageMenu');
            }
        }

        function navigateTo(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            window.scrollTo(0,0);

            if (pageId === 'pageMenu') {
                history.replaceState(null, '', window.location.pathname);
                document.title = 'ספר המתכונים של לולוז';
                renderMenu(); // Uses in-memory cache if already loaded
            }
        }

        // --- HASH-BASED ROUTING ---
        function handleRoute() {
            const hash = window.location.hash.slice(1); // Remove the '#'
            if (hash) {
                viewRecipeBySlug(hash);
            } else {
                navigateTo('pageMenu');
            }
        }

        window.addEventListener('hashchange', handleRoute);

        // Initialize — recipes are loaded lazily from the YAML folder
        handleRoute();
    </script>
</body>
</html>
