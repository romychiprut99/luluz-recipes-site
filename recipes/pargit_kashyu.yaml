title: פרגית קשיו
cat: עיקריות
ingredients: |
  * בצל
  * קשיו
  * 1 ק״ג פרגית
  * סילאן
  * מלח
  * פלפל
  * 2 שיני שום/ כפית אבקת שום
steps: |
  מטגנים בסיר בצל חתוך עם שמן זית ופלפל שחור.
  אחרי שנהיה מעט צבע מוסיפים שיני שום, לערבב ולהוסיף פרגיות חתוכות לקוביות.
  מוסיפים קשיו, סילאן ומלח.
  להוסיף מים עד שמכסה בגובה חצי את הכל.
  לחכות עם מכסה פתוח שהכל מתאדה.