title: שוקו חם
cat: משקאות
ingredients: |
  מצרך לכוס:
  * כף גדושה קקאו
  * כף גדושה סוכר
  * כוס חלב
  * 3 קוביות שוקולד מריר
  * קורט מלח
steps: |
  בפינגן גדול לערבב קקאו, סוכר, מלח ו2 כפות מהחלב (לא על הגז) עד איחוד.
  לאחר מכן שמים את כל שאר החלב והקוביות שוקולד.
  שמים על האש ומערבבים בלי הפסקה עד שהשוקולד נמס והחלב מספיק חם, אבל לשים לב שהחלב לא רותח.