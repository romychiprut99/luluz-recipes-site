title: עוף ותפוחי אדמה בתנור
cat: עיקריות
ingredients: |
  * 2 קילו עוף
  * 10-12 תפוחי אדמה קטנים או 4 תפוחי אדמה גדולים קלופים וחתוכים
  למרינדה:
  * 3 כפות רוטב צילי מתוק
  * 3 כפות רסק עגבניות
  * 3 כפות סויה
  * 3 כפות סילאן
  * 1 כפית פפריקה מתוקה
  * 1 כפית אבקת שום
  * 1/4 כוס מים
steps: |
  מחממים תנור ל200 מעלות טורבו.
  מערבבים היטב את כל חומרי המרינדה.
  שמים את כל החומרים בקערה גדולה ומערבבים.
  מעבירים הכל לתבנית.
  מניחים נייר אפייה על העוף ומעליו נייר אלומיניום.
  אופים שעתיים.
  אם רוצים שהעוף יהיה מעט שחום מסירים את הניירות ואופים עוד 7 דקות לא מכוסה על תוכנית גריל.
