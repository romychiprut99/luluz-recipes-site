title: קציצות ברוטב עגבניות
cat: עיקריות
ingredients: |
  מצרכים לקציצות:
  * 500 גרם בשר טחון
  * 1 בצל בינוני קצוץ דק
  * 2 שיני שום כתושות
  * חופן פטרוזיליה קצוצה דק
  * ביצה אחת
  * 2 כפות פירורי לחם
  * חצי כפית כמון
  * חצי כפית פפריקה מתוקה
  * מלח ופלפל שחור לפי הטעם
  מצרכים לרוטב:
  * 2 כפות שמן
  * 4 שיני שום פרוסות
  * קופסה אחת של עגבניות מרוסקות (או 5-6 עגבניות מרוסקות)
  * כף רסק עגבניות
  * כפית מלח
  * חצי כפית פלפל שחור
  * כפית מלח
  * כפית פפריקה מתוקה
  * מים לפי הצורך (כוס עד כוס וחצי)
steps: |
  מכינים את הקציצות: בקערה גדולה מערבבים היטב את כל מרכיבי הקציצות עד לקבלת תערובת אחידה. יוצרים קציצות בגודל בינוני.

  מכינים את הרוטב: בסיר רחב מחממים שמן, מוסיפים את השום ומטגנים קלות. מוסיפים את העגבניות המרוסקות, רסק העגבניות והתבלינים. מביאים לרתיחה ומבשלים כ-10 דקות.

  בישול הקציצות: מוסיפים בזהירות את הקציצות לרוטב הרותח. מכסים ומבשלים על אש נמוכה כ-40 דקות, עד שהקציצות רכות וספגו את הטעמים.
