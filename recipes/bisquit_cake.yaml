title: עוגת ביסקוויטים
cat: קינוחים
ingredients: |
  * 2 אינסטנט פודינג וניל
  * 2 שמנת מתוקה
  * כוס חלב
  * כפית תמצית וניל
  * 2 מקופלת
  * ביסקוויטים
steps: |
  מקציפים יחס את השמנת, הפודינג והחלב.
  מערבבים בקערה חלב ותמצית וניל.
  טובלים כל פעם בסקוויט ומניחים בתבנית ועושים שכבות.
  מפוררים מעל שברי מקופלת.