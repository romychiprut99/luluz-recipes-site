title: פנקייקים
cat: קינוחים
ingredients: |
  קערה אחת:
  * כוס וחצי קמח
  * 3 כפות סוכר
  * שקית אבקת אפיה (כפית ו3/4)
  * חצי כפית מלח
  קערה שניה:
  * 45 גרם חמאה
  * ביצה
  * כוס ורבע חלב
steps: |
  מתחילים בלערבב את כל המצרכים בכל אחת מהקערות בנפרד (יבשים ורטובים)
  לאחר מכן, מערבבים את שתי הקערות יחד לבלילה אחידה. 
  מכינים פנקייקים. 