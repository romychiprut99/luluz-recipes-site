title: חלות
cat: מאפים
ingredients: |
  * קילו קמח
  * 3 כפות סוכר
  * 2 כפות שמרים יבשים
  * ביצה
  * חצי כוס שמן זית
  * חצי ליטר מים
  * 1.5 כפות מלח
steps: |
  1. מערבבים קמח, שמרים וסוכר.
  2. מוסיפים בהדרגה שמן, ביצה ומים.
  3. לשים עד שנהיה בצק אחיד ואז מוסיפים מלח.
  4. לשים עוד 7 דקות.
  5. מתפיחים את הבצק לפחות 2.5 שעות.
  6. מחלקים לכדורים שווים בגודל ונותנים להם לתפוח עוד (לפחות חצי שעה).
  7. מכינים צורה, מורחים ביצה ומפזרים שומשום.
  8. מכניסים לתנור 170-200 מעלות עד שמוכן.