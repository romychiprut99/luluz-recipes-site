title: שושנים
cat: מאפים
ingredients: |
  * 3 3/4 כוסות קמח שמרים
  * 1/4 כוס סוכר
  * 2 חלמונים
  * 150 גרם חמאה מומסת
  * 3/4 כוס חלב
  * 1/2 מים רותחים
  * 1/2 כפית מלח
steps: |
  1. מכניסים למיקסר קמח שמרים, סוכר, חלמונים וחמאה.
  2. מערבבים יחד את החלב והמים הרותחים ושופכים למיקסר בהדרגה.
  3. מערבבים הכל במהירות בינונית במשך 4 דקות.
  4. מוסיפים מלח וממשיכים לערב עוד דקה.
  5. נותנים לבצק להתפיח ולאחר מכן מכינים את הצורה.
  מברישים עם ביצה ומכניסים לתנור על 180 מעלות עד להשחמה.
