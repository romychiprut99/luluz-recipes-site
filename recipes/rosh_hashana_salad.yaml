title: סלט ראש השנה
cat: עיקריות
ingredients: |
  * עלי רוקט
  * חסה סלנובה
  * חסה לאליק
  * בצל סגול בינוני
  * תפוח ירוק
  * גרגירי רימון

  לרוטב:
  * כפית חרדל דיזון גרגירים
  * מיץ מלימון שלם
  * 5 כפות שמן זית
  * כפית מלח
  * חצי כפית פלפל שחור גרוס
  * 2 שיני שום כתושות
  * 2 כפות גדושות של דבש טהור
steps: |
  1. שוטפים היטב את כל העלים ומפרידים אותם מהגבעול.
  2. חותכים את הבצל לפרוסות דקות.
  3. את כל המצרכים לרוטב מערבבים היטב בקערה.
  4. מעבירים את החסות, הבצל והעלי רוקט לקערה גדולה ושופכים את הרוטב מעל.
  5. חותכים את התפוח למניפות ומפזרים אותו ואת הגרגירי רימון מעל הכל.