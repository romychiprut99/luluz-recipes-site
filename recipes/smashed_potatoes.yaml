title: תפוחי אדמה מעוכים
cat: עיקריות
ingredients: |
  * שקית תפוחי אדמה קטנים
  * כפית טימין
  * 1/3 כפית פלפל שחור
  * 1/3 כפית מלח
  * 1/3 כוס שמן זית
steps: |
  שמים בסיר מים ותפוחי אדמה ומרתיחים על אש גבוהה עד שהתפוחי אדמה מעט רכים.
  בקערה גדולה שמים את השמן זית והתבלינים ומערבבים.
  כשהתפוחי אדמה רכים מסננים ומכניסים לקערה ומערביים.
  מפזרים על תבנית ומועכים.
  מכניסים לתנור על 250 מעלות.