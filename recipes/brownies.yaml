title: בראוניז
cat: קינוחים
ingredients: |
  * 2 ביצים
  * 1 חלבון
  * כפית תמצית וניל
  * 1/3 כוס שמן
  * 3/4 כוס קקאו
  * 1/2 כוס קמח
  * 1/8 כפית אבקת סודה
  * 1/4 כפית מלח
  * 1 כפית קורנפלור
  * 3/4 כוס צוקלט ציפס
steps: |
  מערבבים יחד את החמאה המומסת ואת הסוכר.
  מוסיפים את הביצים והחלמון ותמצית וניל ומערבבים שוב.
  מוסיפים את השמן והקקאו ומערבבים שוב.
  מוסיפים את הקמח, אבקת סודה, מלח וקורנפלור ומערבבים שוב עד למרקם אחיד.
  מוסיפים את הצוקלט ציפס ומערבבים פעם אחרונה.
  מעבירים לתבנית משומנת/מכוסה בנייר אפייה ואופים במשך 30-35 דקות על 160 מעלות.