title: עוגת שוקולד
cat: קינוחים
img: https://images.unsplash.com/photo-1606313564200-e75d5e30476c?w=800
img_pos: 50
ingredients: |
  * 2 כוסות קמח
  * 2 כוסות סוכר
  * 3/4 כוס אבקת קקאו
  * 2 כפיות אבקת אפייה
  * 1 כפית סודה לשתייה
  * 2 ביצים
  * 1 כוס חלב
  * 1/2 כוס שמן
  * 2 כפיות תמצית וניל
  * 1 כוס מים רותחים
steps: |
  מחממים תנור ל-180 מעלות ומשמנים תבנית.
  מערבבים בקערה את כל החומרים היבשים.
  מוסיפים ביצים, חלב, שמן ווניל ומערבבים היטב.
  מוסיפים בזהירות את המים הרותחים ומערבבים (הבלילה תהיה נוזלית).
  יוצקים לתבנית ואופים כ-35 דקות.
  בודקים עם קיסם שיוצא יבש.
  מצננים לפני ההגשה.
