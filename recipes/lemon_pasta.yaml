title: פסטה לימון
cat: עיקריות
ingredients: |
  * 250 גרם פסטה
  * 50 גרם חמאה
  * 2 כפות שמן זית
  * 125 מ״ל שמנת מתוקה/שמנת לבישול
  * 3-4 שיניי שום כתושות
  * כפית גרידת לימון
  * חצי כפית פלפל שחור גרוס
  * כפית שטוחה מלח (או לפי טעם)
  * חצי לימון גדול סחוט 
  * גרידת לימון מחצי לימון/לימון שלם
  * חצי כוס מי בישול פסטה
  * 50 גרם פרמזן מגורדת
steps: |
  מבשלים את הפסטה לפי הוראות היצרן.
  מחממים מחבת וממיסים חמאה ושמן זית.
  מוסיפים למחבת את השום, מטגנים קלות ומוסיפים שמנת מתוקה. מביאים לרתיחה ומוסיפים תבלינים, גרידת לימון , לימון סחוט ומי בישול הפסטה.
  מערבבים היטב ללא הפסקה במשך 2-3 דקות.
  מוסיפים פרמזן, מערבבים עוד קצת ומוסיפים את הפסטה. מבשלים כ-2 דקות.
  מעבירים לצלחת הגשה, מוסיפים פרמזן.