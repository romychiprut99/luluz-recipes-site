title: בצל ממולא
cat: עיקריות
ingredients: |
  * 2 בצלים קצוצים
  * 2 גזרים מגורדים
  * 3 שיני שום כתושות
  * 500 גרם בשר טחון
  * כוס אורז יסמין
  * 1/4 כוס רכז רימונים
  * צרור נענע טרייה
  * חצי לימון סחוט
  * 2 כפות רסק עגבניות
  * 40 גרם צנוברים
  * מלח

  מצרכים לרוטב: 
  * 2 וחצי כוסות מים (מי הבישול של הבצל)
  * 2 כפות רסק עגבניות
  * 1/4 כוס רכז רימונים
  * 2 כפות סילאן
  * 2 כפיות מלח
steps: |
  1. נקלף בצלים וניצור להם חריץ עד המרכז של הבצל, נניח בסיר עם מים וקצת מלח ונבשל כ-20 דקות עד שהבצלים מתרככים.
  2. נוציא את הבצלים לקערה עם מים קרים ונשמור את מי הבישול לרוטב.

  למילוי:
  1. במחבת עם מעט שמן נטגן בצל עד הזהבה, נוסיף גזר ושום ונערבב כ-3 דקות.
  2. נוסיף בשר טחון ונטגן עד שהבשר מחליף צבע. נוסיף רכז רימונים, רסק עגבניות, נענע קצוצה, אורז יסמין ששטפנו וסיננו, מלח, מיץ לימון וצנוברים. נערבב הכל יחד, נביא לצמצום של הנוזלים ונכבה את האש.
  3. נסנן את הבצלים מהנוזלים ונפרדים לגלדים.
  4. כל גלד נמלא במילוי ונגלגל, נניח במסודר בסיר רחב ונמוך, נסדר את הבצלים צמודים זה לזה שלא יהיה להם מקום לזוז.

  לרוטב:
  1. בסיר נערבב יחד רכז רימונים, סילאן, מלח ורסק עגבניות. נוסיף את המים בהם בישלנו את הבצל ונביא לרתיחה.
  2. נשפוך את הרוטב מעל הסיר עם הבצלים, נכסה בנייר אפייה ונייר כסף.
  3. נכניס לתנור שחומם מראש ל-180 מעלות טורבו לשעתיים.
  4. נוריד את הנייר כסף והנייר אפייה. נשקה קצת בנוזלים (אם צריך) ונכניס לתנור ל-20 דקות נוספות.